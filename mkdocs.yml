site_name: NexusPilot
site_description: Universal Desktop Computer-Use MCP Suite & Antigravity Plugin
site_author: Nishant Shaligram
site_url: https://nishantshaligram.github.io/NexusPilot/
repo_url: https://github.com/nishantshaligram/NexusPilot
repo_name: nishantshaligram/NexusPilot

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/icon_mark.jpg
  palette:
    - scheme: slate
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: cyan
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list

nav:
  - Overview: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart Guide: getting-started/quickstart.md
  - Architecture:
      - Dual-Modal Perception: architecture/dual-modal.md
      - Win32 Actuation Engine: architecture/actuation.md
      - Safety Guardian & Failsafes: architecture/safety.md
  - Agent Integrations:
      - Google Antigravity: integrations/antigravity.md
      - Claude (Code & Desktop): integrations/claude.md
      - Cursor & Windsurf: integrations/cursor.md
  - API & Tool Reference:
      - MCP Tool Catalog: reference/mcp-tools.md
      - Windows Shortcuts: reference/shortcuts.md
