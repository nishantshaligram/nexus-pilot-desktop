<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#090D16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.8" />
    </linearGradient>

    <!-- Pilot Wings Gradient -->
    <linearGradient id="wingGradLeft" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="wingGradRight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="70%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Cursor Gradient -->
    <linearGradient id="cursorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Accent Flare Gradient -->
    <linearGradient id="accentFlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Radar Pulse Radial Gradient -->
    <radialGradient id="radarPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. Squircle App Icon Container -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" filter="url(#shadowFilter)" />

  <!-- 2. Cybernetic Grid Texture (Subtle) -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="1">
    <line x1="80" y1="180" x2="432" y2="180" />
    <line x1="80" y1="256" x2="432" y2="256" />
    <line x1="80" y1="332" x2="432" y2="332" />
    <line x1="180" y1="80" x2="180" y2="432" />
    <line x1="256" y1="80" x2="256" y2="432" />
    <line x1="332" y1="80" x2="332" y2="432" />
  </g>

  <!-- 3. Radar Center Glow -->
  <circle cx="256" cy="256" r="140" fill="url(#radarPulse)" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="10 6" opacity="0.4" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#6366F1" stroke-width="1.5" opacity="0.5" />

  <!-- 4. Supersonic Pilot Wings (Aeronautical Sweep) -->
  <!-- Left Wing -->
  <path d="M 230 256 L 90 200 L 140 256 L 96 280 L 230 270 Z" fill="url(#wingGradLeft)" opacity="0.9" />
  <path d="M 220 256 L 110 220 L 150 256 Z" fill="#38BDF8" opacity="0.6" />
  
  <!-- Right Wing -->
  <path d="M 282 256 L 422 200 L 372 256 L 416 280 L 282 270 Z" fill="url(#wingGradRight)" opacity="0.9" />
  <path d="M 292 256 L 402 220 L 362 256 Z" fill="#38BDF8" opacity="0.6" />

  <!-- 5. Glassmorphism Desktop Surface Frame -->
  <rect x="146" y="146" width="220" height="150" rx="16" fill="#0F172A" fill-opacity="0.65" stroke="#38BDF8" stroke-width="3" filter="url(#shadowFilter)" />
  <!-- Window Header Bar with Status Dots -->
  <rect x="146" y="146" width="220" height="28" rx="16" fill="#1E293B" fill-opacity="0.8" />
  <circle cx="168" cy="160" r="4.5" fill="#EF4444" />
  <circle cx="184" cy="160" r="4.5" fill="#F59E0B" />
  <circle cx="200" cy="160" r="4.5" fill="#10B981" />

  <!-- Monitor Stand Base -->
  <path d="M 240 296 L 234 330 L 220 330 L 292 330 L 278 330 L 272 296 Z" fill="#334155" />
  <rect x="210" y="328" width="92" height="6" rx="3" fill="#64748B" />

  <!-- 6. High-Tech Actuation Cursor (The Pilot Needle) -->
  <g transform="translate(230, 196)" filter="url(#glowFilter)">
    <!-- Jet Speed Trail -->
    <path d="M 26 58 L 26 84" stroke="url(#accentFlare)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 18 58 L 10 74" stroke="url(#accentFlare)" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
    <path d="M 34 58 L 42 74" stroke="url(#accentFlare)" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />

    <!-- Cursor Pointer Geometry -->
    <path d="M 26 0 L 58 64 L 32 54 L 26 78 L 20 54 L -6 64 Z" fill="url(#cursorGrad)" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round" />
    
    <!-- Core Flare Spark -->
    <circle cx="26" cy="24" r="5" fill="#FFFFFF" />
  </g>

  <!-- 7. Outer Orbit Nodes / Coordinates Target Indicators -->
  <circle cx="146" cy="146" r="4" fill="#38BDF8" />
  <circle cx="366" cy="146" r="4" fill="#38BDF8" />
  <circle cx="146" cy="296" r="4" fill="#38BDF8" />
  <circle cx="366" cy="296" r="4" fill="#38BDF8" />

  <!-- Crosshair Accent Reticle (Top-Right) -->
  <path d="M 380 110 L 400 110 M 390 100 L 390 120" stroke="#F43F5E" stroke-width="2" stroke-linecap="round" />
  <circle cx="390" cy="110" r="16" fill="none" stroke="#F43F5E" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.7" />
</svg>
